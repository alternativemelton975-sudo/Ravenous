<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravenous</title>

  <style>
    .business {
      display: flex;
      flex-direction: column;
      inline-size: 300px;
      margin: 1rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      background: white;
    }

    .businessImage img {
      inline-size: 100%;
      block-size: 200px;
      object-fit: cover;
    }

    .businessInfo {
      padding: 1rem;
    }

    .businessAddress p {
      margin: 0;
      font-size: 0.9rem;
      color: #666;
    }

    .businessList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff5f2;
      color: #333;
      text-align: center;
    }

    .app {
      padding: 2rem;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>RAVENOUS CAFE</h1>

    <div class="businessList">

      <div class="business">
        <div class="businessImage">
          <img src="https://content.codecademy.com/programs/react/ravenous/pizza.jpg" alt="MarginOtto Pizzeria" />
        </div>
        <div class="businessInfo">
          <h3>MarginOtto Pizzeria</h3>
          <div class="businessAddress">
            <p>1010 Paddington Way</p>
            <p>Flavortown</p>
            <p>NY 10101</p>
          </div>
          <div class="businessReviews">
            <div class="businessRating">
              <p>Italian</p>
              <p>4.5 stars</p>
            </div>
            <p>90 reviews</p>
          </div>
        </div>
      </div>

      <div class="business">
        <div class="businessImage">
          <img src="https://content.codecademy.com/programs/react/ravenous/pizza.jpg" alt="Another Cafe" />
        </div>
        <div class="businessInfo">
          <h3>Another Cafe</h3>
          <div class="businessAddress">
            <p>2020 Cafe St</p>
            <p>Coffeetown</p>
            <p>CA 90210</p>
          </div>
          <div class="businessReviews">
            <div class="businessRating">
              <p>Cafe</p>
              <p>4 stars</p>
            </div>
            <p>45 reviews</p>
          </div>
        </div>
      </div>

      <div class="business">
        <div class="businessImage">
          <img src="https://content.codecademy.com/programs/react/ravenous/pizza.jpg" alt="Third Place" />
        </div>
        <div class="businessInfo">
          <h3>Third Place</h3>
          <div class="businessAddress">
            <p>3030 Third Ave</p>
            <p>Thirdcity</p>
            <p>TX 30303</p>
          </div>
          <div class="businessReviews">
            <div class="businessRating">
              <p>Restaurant</p>
              <p>3.5 stars</p>
            </div>
            <p>67 reviews</p>
          </div>
        </div>
      </div>

    </div>
  </main>
</body>
</html>
